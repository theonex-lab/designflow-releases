[package]
name = "designflow-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DesignFlow egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
designflow-geom = { workspace = true }
designflow-color = { workspace = true }
designflow-doc = { workspace = true }
designflow-text = { workspace = true }
designflow-layout = { workspace = true }
designflow-render = { workspace = true }
designflow-pathops = { workspace = true }
designflow-engine = { workspace = true }
designflow-format = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
base64 = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"
ehttp = "=0.7.2"

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
wat = { workspace = true }
# Keep the test font features explicit; production uses the same bundled fallback faces.
# Dependency dev-features do not propagate into app release builds.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
